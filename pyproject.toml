[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsl-maf"
version = "0.2.2"
description = "Microsoft Agent Framework (agent-framework) adapter for VSL (VERBA Specification Language) governance primitives -- implements vsl-core's VSLAdapter conformance contract."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    # vsl-core, published on PyPI as super-semantics-vsl (imported as vsl_core).
    # vsl_maf also checks the installed version on import (needs >= 0.2.0).
    "super-semantics-vsl>=0.3,<0.4",
    # Core only: the adapter needs FunctionMiddleware and MiddlewareFailure, not
    # every model connector. Tested against 1.25.0.
    "agent-framework-core>=1.25.0",
]
keywords = ["governance", "ai-safety", "guardrails", "agent-framework", "vsl", "verba", "microsoft-agent-framework"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://github.com/supersemantics/VSL-Microsoft-agent-framework"
Repository = "https://github.com/supersemantics/VSL-Microsoft-agent-framework"
Changelog = "https://github.com/supersemantics/VSL-Microsoft-agent-framework/blob/HEAD/CHANGELOG.md"
Issues = "https://github.com/supersemantics/VSL-Microsoft-agent-framework/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
